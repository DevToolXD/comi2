[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-harness"
version = "0.1.0"
description = "A DeepSeek V4 harness built around reasoning-state continuity"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []          # stdlib-only; httpx is used when present

[project.optional-dependencies]
fast = ["httpx>=0.27"]
dev = ["pytest>=8"]

[project.scripts]
deepseek-harness = "deepseek_harness.cli:main"

[tool.setuptools.packages.find]
include = ["deepseek_harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
